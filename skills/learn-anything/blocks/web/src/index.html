<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Learn Anything</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%231b1a18'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='36' font-family='Georgia' fill='%23fbfaf7'%3EL%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <button id="mentor-rescue" type="button" aria-label="Ask mentor">Ask mentor</button>
    <div id="root"></div>
    <script>
      (() => {
        const root = document.getElementById("root");
        const rescue = document.getElementById("mentor-rescue");
        document.body.dataset.focus = "chat";

        const chatHasPreservedWork = () => document.body.dataset.focus === "chat"
          && document.body.dataset.hasWork === "1"
          && document.body.dataset.returnWork !== "1";

        const updateRescue = () => {
          const returning = document.body.dataset.rescue === "1" || chatHasPreservedWork();
          rescue.textContent = returning ? "Back to activity" : "Ask mentor";
          rescue.setAttribute("aria-label", returning ? "Return to preserved activity" : "Ask mentor");
        };

        rescue.addEventListener("click", () => {
          if (document.body.dataset.crashed === "1" || !root.firstElementChild) {
            window.location.reload();
            return;
          }
          if (document.body.dataset.rescue === "1" || chatHasPreservedWork()) {
            delete document.body.dataset.rescue;
            delete document.body.dataset.rescueSurface;
            document.body.dataset.returnWork = "1";
            document.body.dataset.returnWorkSurface = document.body.dataset.surfaceId || "";
            updateRescue();
            window.dispatchEvent(new Event("learn-anything:return-work"));
            return;
          }
          delete document.body.dataset.returnWork;
          delete document.body.dataset.returnWorkSurface;
          document.body.dataset.rescue = "1";
          document.body.dataset.rescueSurface = document.body.dataset.surfaceId || "";
          updateRescue();
          window.dispatchEvent(new Event("learn-anything:rescue-chat"));
        });

        new MutationObserver(updateRescue).observe(document.body, {
          attributes: true,
          attributeFilter: ["data-focus", "data-has-work", "data-rescue", "data-return-work"],
        });
        updateRescue();

        const revealBeforeMount = () => {
          if (!root.firstElementChild) document.body.dataset.crashed = "1";
        };
        window.addEventListener("error", revealBeforeMount);
        window.addEventListener("unhandledrejection", revealBeforeMount);
        window.setTimeout(() => {
          if (!root.firstElementChild) revealBeforeMount();
        }, 3000);
      })();
    </script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
